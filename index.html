<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - StockPro | Digital DevSolutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <span class="login-badge">Digital DevSolutions</span>
            <h1>StockPro ERP</h1>
            <p>Accès sécurisé à la gestion de stock</p>
        </div>

        <div id="error-box" class="alert-error"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" class="form-control" required value="habib" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" class="form-control" required value="123456789" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Accéder au Tableau de Bord
            </button>
        </form>
    </div>

    <script>
        // Si déjà connecté, redirection directe
        if (localStorage.getItem('stock_user') === 'habib') {
            window.location.href = 'dashboard.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            if (username === 'habib' && password === '123456789') {
                localStorage.setItem('stock_user', username);
                window.location.href = 'dashboard.html';
            } else {
                errorBox.textContent = "Identifiants invalides (Utilisez habib / 123456789).";
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
